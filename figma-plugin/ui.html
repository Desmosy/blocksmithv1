<!doctype html><html><head><meta charset="utf-8"><style>
body{font:12px Inter,Arial,sans-serif;margin:0;padding:16px;color:#18181b}h2{margin:0 0 6px}p{color:#71717a;line-height:1.45}.config{display:grid;grid-template-columns:1fr;gap:6px;margin:12px 0}.config input{border:1px solid #d4d4d8;border-radius:6px;padding:8px;font:inherit}.toolbar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}button{border:0;border-radius:7px;padding:9px 12px;font-weight:600;cursor:pointer}button.primary{background:#18181b;color:white}button:disabled{opacity:.4}.list{height:340px;overflow:auto;border:1px solid #e4e4e7;border-radius:8px}.row{display:grid;grid-template-columns:22px 1fr;padding:9px;border-bottom:1px solid #f4f4f5}.row:last-child{border:0}.name{font-weight:600}.meta{font-size:10px;color:#a1a1aa;margin-top:2px}.proposal{color:#52525b;margin-top:4px;line-height:1.35}.category{display:inline-block;margin-top:4px;padding:2px 5px;border-radius:4px;background:#f4f4f5;font-size:10px;font-weight:600}
</style></head><body><h2>BlockSmith Annotate</h2><p>Generate node-linked annotation proposals. Nothing becomes official until you review and publish it.</p><div class="config"><input id="server" placeholder="BlockSmith server" value="http://localhost:3000"><input id="key" type="password" placeholder="BlockSmith API key (bs_live_…)"></div><div class="toolbar"><button id="scan">Local preview</button><button class="primary" id="propose">Generate AI proposals</button><button class="primary" id="apply" disabled>Apply selected</button></div><div id="status"></div><div class="list" id="list"></div><script>
const list=document.getElementById('list'),apply=document.getElementById('apply'),status=document.getElementById('status');let items=[];
document.getElementById('scan').onclick=()=>parent.postMessage({pluginMessage:{type:'scan'}},'*');
document.getElementById('propose').onclick=()=>{status.textContent='Rendering selection and generating proposals…';parent.postMessage({pluginMessage:{type:'propose',server:document.getElementById('server').value,apiKey:document.getElementById('key').value}},'*')};
apply.onclick=()=>parent.postMessage({pluginMessage:{type:'apply',items:items.filter((_,i)=>document.getElementById('n'+i)?.checked)}},'*');
onmessage=({data})=>{const m=data.pluginMessage;if(m?.type==='ready')parent.postMessage({pluginMessage:{type:'settings'}},'*');if(m?.type==='settings'){document.getElementById('server').value=m.settings.server||'http://localhost:3000';document.getElementById('key').value=m.settings.apiKey||''}if(m?.type==='candidates'||m?.type==='proposals'){items=m.items;list.innerHTML=items.map((x,i)=>`<label class="row"><input id="n${i}" type="checkbox" checked><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.type)} · ${esc(x.id)}${x.existing?.length?' · '+x.existing.length+' existing':''}</div>${x.category?`<span class="category">${esc(x.category)} · ${esc(x.confidence)}</span>`:''}<div class="proposal">${esc(x.proposal)}</div></div></label>`).join('');apply.disabled=!items.length;status.textContent=`${items.length} proposal${items.length===1?'':'s'} found${m.model?' with '+m.model:''}.`}if(m?.type==='applied')status.textContent=`Applied ${m.count}. Review annotations in Figma Dev Mode.`;if(m?.type==='error')status.textContent=`Error: ${m.message}`};
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
</script></body></html>

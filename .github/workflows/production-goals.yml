# Production goals gate (GOAL-SAAS-STATUS.md §Goal 1 + Goal 2).
#
# Runs the public-route production checks against the live deploy after a merge
# to main (Vercel ships main → production). Set the repo variable
# BLOCKSMITH_URL to your production origin to arm it; without it the script
# SKIPs (exit 0) so the gate never blocks on an unconfigured environment.
name: production-goals

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production-goals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Wait for production deploy to settle
        run: sleep 60

      - name: verify:production-goals (public routes on prod)
        env:
          BLOCKSMITH_URL: ${{ vars.BLOCKSMITH_URL }}
        run: npm run verify:production-goals

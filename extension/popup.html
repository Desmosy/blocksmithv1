<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #101418;
        --panel: #1a2026;
        --border: #2a323b;
        --text: #e8edf2;
        --muted: #8a939e;
        --accent: #beff50;
        --error: #ef8a80;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        letter-spacing: 0.01em;
      }
      .sub {
        margin: 0 0 12px;
        font-size: 11px;
        color: var(--muted);
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.15);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #generate {
        background: var(--accent);
        color: #14140f;
        border-color: var(--accent);
      }
      .thumbs {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        min-height: 44px;
      }
      .thumbs img {
        width: 72px;
        height: 44px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }
      .row label {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      input {
        flex: 1;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 11px;
      }
      #status {
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--muted);
        min-height: 16px;
        word-break: break-word;
      }
      #status.error {
        color: var(--error);
      }
      #status a {
        color: var(--accent);
      }
      .clear {
        background: none;
        border: none;
        width: auto;
        margin: 0;
        padding: 0;
        color: var(--muted);
        font-size: 11px;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>BlockSmith Capture</h1>
    <p class="sub">Design → governed design.md. Works on Canva, Figma, Adobe, anything.</p>

    <button id="capture">📸 Capture this tab</button>
    <div class="thumbs" id="thumbs"></div>
    <div class="row" style="justify-content: space-between">
      <span id="count" style="font-size: 11px; color: var(--muted)">0 captures</span>
      <button class="clear" id="clear">clear</button>
    </div>

    <div class="row">
      <label for="server">Server</label>
      <input id="server" placeholder="https://blocksmith-mocha.vercel.app" />
    </div>

    <div class="row">
      <label for="targetDoc">Enrich Figma doc (optional)</label>
      <input id="targetDoc" placeholder="upload:scan-figma-….md" />
    </div>

    <button id="generate" disabled>Generate or enrich design.md</button>
    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
